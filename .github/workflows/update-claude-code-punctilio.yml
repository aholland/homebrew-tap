name: Update claude-code-punctilio
# The watcher (watcher/worker.js) finds runs for a version by this exact title.
run-name: Update claude-code-punctilio to ${{ inputs.version || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version to publish. Blank means Anthropic's "latest".
        required: false
        type: string

concurrency:
  group: update-claude-code-punctilio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Verify the release and update the cask
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)"
          fi
          tools/update-cask.sh "$VERSION"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          VERSION="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/claude-code-punctilio.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update claude-code-punctilio to $VERSION"
          git push
